<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hubungi Madam Ti'</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0518;
            --primary: #9d00ff;
            --accent: #ff007f;
            --bubble-in: #2d1b4e;
            --bubble-out: #ff007f;
            --text-dim: #a0a0a0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Lato', sans-serif;
            background: radial-gradient(circle at center, #2e004f 0%, #000000 100%);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        h1, h2 { font-family: 'Cinzel', serif; }

        .header {
            background: linear-gradient(135deg, #4b0082, #000);
            color: white;
            padding: 12px;
            border-bottom: 2px solid var(--accent);
            flex-shrink: 0;
            padding-top: max(12px, env(safe-area-inset-top));
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 { font-size: 1.1em; text-shadow: 0 0 10px var(--primary); }

        .header .patient-info {
            font-size: 0.75em;
            color: #00ff88;
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .header .connection-status {
            font-size: 0.7em;
            padding: 3px 10px;
            border-radius: 10px;
            background: rgba(0, 255, 136, 0.2);
        }

        .btn-exit-header {
            background: #500000;
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        #login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 0;
        }

        .card {
            background: rgba(26, 11, 46, 0.9);
            width: 100%;
            max-width: 350px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.2);
            border: 1px solid rgba(157, 0, 255, 0.3);
        }

        .card input { width: 100%; padding: 14px; border: 1px solid #4b0082; border-radius: 12px; font-size: 16px; margin-bottom: 10px; background: #0f0518; color: white; }
        .card input:focus { border-color: var(--accent); outline: none; }
        .card input::placeholder { color: #666; }
        .card label { display: block; margin-top: 10px; color: var(--primary); font-size: 0.85em; margin-bottom: 5px; font-family: 'Cinzel', serif; }

        .btn-connect { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; background: linear-gradient(90deg, var(--primary), var(--accent)); color: white; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        .btn-connect:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { text-align: center; padding-top: 15px; color: var(--primary); font-size: 0.85em; font-family: 'Cinzel'; }

        #chat-area {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        .msg {
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 80%;
            font-size: 0.95em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            line-height: 1.4;
            word-wrap: break-word;
            flex-shrink: 0;
        }

        .msg-in { background: var(--bubble-in); color: white; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(157, 0, 255, 0.2); }
        .msg-out { background: linear-gradient(135deg, var(--accent), #9d00ff); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

        .footer-controls {
            flex-shrink: 0;
            background: rgba(26, 11, 46, 0.95);
            border-top: 1px solid rgba(157, 0, 255, 0.3);
            padding: 10px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            backdrop-filter: blur(5px);
            width: 100%;
            z-index: 100;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
            flex-wrap: nowrap;
        }

        .input-row input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #4b0082;
            border-radius: 25px;
            font-size: 16px;
            background: #0f0518;
            color: white;
            outline: none;
            min-width: 0;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            min-width: 44px;
            max-width: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            background: #2d1b4e;
            color: white;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:active { transform: scale(0.9); }
        .btn-send { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .btn-call { background: #1a4d2e; color: #00ff88; border: 1px solid #00ff88; }
        .btn-call.active-call { background: #500000; color: #ff4444; border-color: #ff4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); } }

        .file-attachment {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 100%;
        }
        .file-attachment img {
            max-width: 100%;
            max-height: 250px;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
            margin: 0 auto;
        }
        .file-info { padding: 8px; background: rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px; }
        .download-link { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.85em; }

        #file-input { display: none; }
        .loading-status { text-align: center; color: var(--primary); font-size: 0.8em; padding: 5px; }

        .notification-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease;
            max-width: 90%;
            width: 350px;
        }
        .notification-popup.show { transform: translateX(-50%) translateY(0); }
        .notification-icon { font-size: 1.5em; }
        .notification-content { flex: 1; min-width: 0; }
        .notification-title { font-weight: bold; font-size: 0.9em; margin-bottom: 3px; }
        .notification-message { font-size: 0.85em; opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #ended-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            min-height: 0;
        }
        #ended-screen h2 { color: var(--accent); margin-bottom: 10px; }
        #ended-screen p { color: var(--text-dim); margin-bottom: 20px; }
        .btn-reconnect {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .file-attachment img { max-height: 200px; }
            .msg { max-width: 85%; }
            .footer-controls { padding: 8px; }
            .icon-btn { width: 42px; height: 42px; min-width: 42px; max-width: 42px; }
            .btn-exit-header { padding: 6px 12px; font-size: 0.75em; }
            .input-row input[type="text"] { font-size: 14px; padding: 10px 12px; }
            .header h2 { font-size: 1em; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .header { padding: 6px 12px; gap: 4px; }
            .header h2 { font-size: 0.9em; }
            .footer-controls { padding: 6px; }
            .icon-btn { width: 36px; height: 36px; min-width: 36px; max-width: 36px; font-size: 1.1em; }
            .msg { padding: 8px 12px; font-size: 0.85em; }
        }
    </style>
</head>
<body>

<div id="notification" class="notification-popup">
    <div class="notification-icon">🔮</div>
    <div class="notification-content">
        <div class="notification-title" id="notif-title">Pesan Baru</div>
        <div class="notification-message" id="notif-message">...</div>
    </div>
</div>

<div class="header">
    <div class="header-top">
        <h2>🔮 Konsultasi Madam Ti'</h2>
        <button class="btn-exit-header" onclick="exitSession()" id="exit-btn" style="display: none;">🚪 Akhiri Sesi</button>
    </div>
    <div class="patient-info" id="patient-info" style="display: none;">
        <span id="display-patient-name">👤 Nama Pasien</span>
        <span class="connection-status" id="connection-status">● Online</span>
    </div>
</div>

<div id="login-container">
    <div class="card">
        <p style="color:#aaa; text-align: center; margin-bottom: 15px; font-size: 0.9em;">Isi data untuk memulai terawang</p>

        <label>✦ Nama Anda</label>
        <input type="text" id="patientName" placeholder="Masukkan nama Anda">

        <label>✦ ID Spiritual Madam Ti' (4 Digit)</label>
        <input type="text" id="adminId" placeholder="Contoh: 8392" maxlength="4" inputmode="numeric" pattern="[0-9]*">

        <button class="btn-connect" id="btn-connect" onclick="connect()">Hubungkan Energi</button>
        <div id="status" class="status">Menunggu koneksi spiritual...</div>
    </div>
</div>

<div id="chat-area">
    <div id="chat-box"></div>

    <div class="footer-controls">
        <div class="input-row">
            <label for="file-input" class="icon-btn" title="Upload File">📎</label>
            <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.gif" onchange="handleFileSelect(event)">
            <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="icon-btn btn-send" onclick="sendMsg()" title="Kirim">▶</button>
            <button id="btn-call" class="icon-btn btn-call" onclick="toggleCall()" title="Telepon Madam">📞</button>
        </div>
    </div>
</div>

<div id="ended-screen">
    <h2>🔮 Sesi Konsultasi Berakhir</h2>
    <p id="end-message">Terima kasih telah berkonsultasi dengan Madam Ti'</p>
    <p style="font-size: 0.85em; opacity: 0.7;">Semoga energi baik menyertai Anda</p>
    <button class="btn-reconnect" onclick="location.reload()">🔄 Konsultasi Lagi</button>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script>
    let peer = null;
    let conn = null;
    let call = null;
    let localStream = null;
    let isCalling = false;
    let patientName = '';
    let adminId = '';
    let heartbeatInterval = null;
    let reconnectAttempts = 0;
    let isConnected = false;
    let callTimeout = null;
    const MAX_FILE_SIZE = 3 * 1024 * 1024;
    const MAX_RECONNECT = 5;

    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    let wakeLock = null;
    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('🔒 Wake Lock aktif');
            } catch (err) {
                console.log('Wake Lock tidak didukung:', err);
            }
        }
    }

    function startHeartbeat() {
        if (heartbeatInterval) clearInterval(heartbeatInterval);

        heartbeatInterval = setInterval(() => {
            if (conn && conn.open) {
                conn.send({ type: 'heartbeat', timestamp: Date.now() });
                console.log('💓 Heartbeat sent');
            } else if (conn && !conn.open && reconnectAttempts < MAX_RECONNECT) {
                console.log('🔄 Attempting reconnect...', reconnectAttempts + 1);
                reconnectAttempts++;
                reconnect();
            }
        }, 5000);
    }

    function stopHeartbeat() {
        if (heartbeatInterval) {
            clearInterval(heartbeatInterval);
            heartbeatInterval = null;
        }
    }

    function reconnect() {
        if (!adminId) return;

        document.getElementById('connection-status').innerText = '🔄 Reconnecting...';
        document.getElementById('connection-status').style.background = 'rgba(255, 165, 0, 0.2)';

        peer = new Peer({
            debug: 2,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', () => {
            conn = peer.connect(adminId, { reliable: true, serialization: 'json' });
            setupConnectionHandlers();
        });
    }

    function getMessageText(data) {
        if (typeof data === 'string') {
            return data;
        } else if (data && typeof data === 'object') {
            if (data.text) return data.text;
            if (data.message) return data.message;
            if (data.content) return data.content;
        }
        return '...';
    }

    function setupConnectionHandlers() {
        if (!conn) {
            console.error('❌ No connection object!');
            return;
        }

        console.log('🔧 Setting up connection handlers...');

        conn.on('open', () => {
            console.log('✅ Connection OPEN!');
            reconnectAttempts = 0;
            isConnected = true;

            document.getElementById('connection-status').innerText = '● Online';
            document.getElementById('connection-status').style.background = 'rgba(0, 255, 136, 0.2)';

            document.getElementById('patient-info').style.display = 'flex';
            document.getElementById('display-patient-name').innerText = '👤 ' + patientName;

            document.getElementById('exit-btn').style.display = 'block';

            conn.send({ type: 'patientInfo', name: patientName });
            console.log('📤 Sent patient info:', patientName);

            transitionToChat();
            startHeartbeat();
        });

        conn.on('data', (data) => {
            console.log('📩 Received data:', data);

            if (data && data.type === 'heartbeat') {
                return;
            }

            if (data && data.type === 'exit') {
                const reason = data.reason || 'madam_finished';
                const message = data.message || 'Madam Ti\' telah mengakhiri sesi konsultasi';

                addSystemBubble('❌ ' + message);

                setTimeout(() => {
                    exitSession(message);
                }, 2000);
                return;
            }

            const box = document.getElementById('chat-box');

            if (data && data.type === 'file') {
                addFileToBox(data, 'in');
            } else {
                const messageText = getMessageText(data);

                const div = document.createElement('div');
                div.className = 'msg msg-in';
                div.innerHTML = '<b style="color:var(--accent); font-size:0.8em;">Madam Ti\'</b><br>' + messageText;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;

                showNotification('Madam Ti\'', messageText);
            }

            if(navigator.vibrate) navigator.vibrate(100);
        });

        conn.on('error', (err) => {
            console.error('❌ Connection error:', err);
            document.getElementById('connection-status').innerText = '️ Error';
            document.getElementById('connection-status').style.background = 'rgba(255, 68, 68, 0.2)';
            document.getElementById('status').innerText = 'Error: ' + err.type;
            document.getElementById('btn-connect').disabled = false;
            document.getElementById('btn-connect').innerText = 'Hubungkan Energi';
        });

        conn.on('close', () => {
            console.log('❌ Connection closed');
            stopHeartbeat();
            isConnected = false;
            document.getElementById('exit-btn').style.display = 'none';

            if (reconnectAttempts < MAX_RECONNECT) {
                setTimeout(() => {
                    reconnect();
                }, 3000);
            } else {
                document.getElementById('connection-status').innerText = '❌ Terputus';
                document.getElementById('connection-status').style.background = 'rgba(255, 68, 68, 0.2)';
                addSystemBubble('❌ Koneksi terputus. Silakan hubungkan lagi.');
            }
        });
    }

    function transitionToChat() {
        console.log('🔄 Transitioning to chat screen...');

        document.getElementById('login-container').style.display = 'none';
        document.getElementById('chat-area').style.display = 'flex';

        addSystemBubble('✅ Anda terhubung. Silakan mulai konsultasi.');

        console.log('✅ Transition complete!');
    }

    function connect() {
        adminId = document.getElementById('adminId').value.trim();
        patientName = document.getElementById('patientName').value.trim();

        if(!patientName) {
            alert('Masukkan nama Anda!');
            return;
        }

        if(!adminId) {
            alert('Masukkan ID Madam Ti\' (4 digit)!');
            return;
        }

        if(adminId.length !== 4 || !/^\d+$/.test(adminId)) {
            alert('ID harus 4 digit angka!');
            return;
        }

        const btn = document.getElementById('btn-connect');
        btn.disabled = true;
        btn.innerText = 'Menghubungkan...';
        document.getElementById('status').innerText = 'Menghubungkan...';

        console.log(' Connecting to:', adminId);

        peer = new Peer({
            debug: 2,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (id) => {
            console.log('✅ Patient peer open:', id);

            conn = peer.connect(adminId, {
                reliable: true,
                serialization: 'json'
            });
            setupConnectionHandlers();
        });

        peer.on('error', (err) => {
            console.error('❌ Peer error:', err);
            document.getElementById('status').innerText = 'Error: ' + err.type;
            btn.disabled = false;
            btn.innerText = 'Hubungkan Energi';

            if (err.type === 'peer-unavailable') {
                alert('❌ ID Madam Ti tidak ditemukan atau sedang offline.\n\nPastikan:\n1. ID yang dimasukkan benar (4 digit)\n2. Madam Ti sedang online di index.html\n3. Coba refresh halaman Madam Ti dan coba lagi');
            } else if (err.type === 'network') {
                alert('⚠️ Error jaringan. Periksa koneksi internet Anda.');
            }
        });

        peer.on('disconnected', () => {
            console.log('⚠️ Peer disconnected');
        });
    }

    function showNotification(title, message) {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body: message || 'Pesan baru', vibrate: [200, 100, 200] });
        }

        const popup = document.getElementById('notification');
        document.getElementById('notif-title').innerText = title;
        document.getElementById('notif-message').innerText = message || 'Pesan baru';

        popup.classList.add('show');

        setTimeout(() => {
            popup.classList.remove('show');
        }, 3000);
    }

    function sendMsg() {
        const input = document.getElementById('msgInput');
        const messageText = input.value.trim();

        if(conn && conn.open && messageText) {
            conn.send({ type: 'text', text: messageText });

            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'msg msg-out';
            div.innerText = messageText;
            box.appendChild(div);
            input.value = '';
            box.scrollTop = box.scrollHeight;
        } else if (!conn || !conn.open) {
            alert('Koneksi terputus. Silakan hubungkan lagi.');
        }
    }

    function addSystemBubble(text) {
        const box = document.getElementById('chat-box');
        box.innerHTML += '<div style="text-align:center; color:#888; font-size:0.75em; margin:5px 0;">' + text + '</div>';
        box.scrollTop = box.scrollHeight;
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (file.size > MAX_FILE_SIZE) {
            alert('File terlalu besar! Maksimal 3MB.');
            event.target.value = '';
            return;
        }

        const fileSizeMB = (file.size / (1024*1024)).toFixed(1);
        const box = document.getElementById('chat-box');
        const status = document.createElement('div');
        status.className = 'loading-status';
        status.innerHTML = ' Mengirim (' + fileSizeMB + ' MB)...';
        box.appendChild(status);
        box.scrollTop = box.scrollHeight;

        const reader = new FileReader();
        reader.onload = function(e) {
            const fileData = { type: 'file', name: file.name, size: file.size, fileType: file.type, data: e.target.result };
            if(conn && conn.open) {
                conn.send(fileData);
                addFileToBox(fileData, 'out');
            }
            status.remove();
            event.target.value = '';
        };

        reader.onerror = function() {
            status.innerHTML = '❌ Gagal mengirim.';
        };
        reader.readAsDataURL(file);
    }

    function addFileToBox(fileData, type) {
        const box = document.getElementById('chat-box');
        const isImage = fileData.fileType.startsWith('image/');
        const div = document.createElement('div');
        div.className = 'msg msg-' + type;

        let content = '';
        if (isImage) {
            content = '<div class="file-attachment"><img src="' + fileData.data + '" onclick="window.open(this.src)"></div>';
        } else {
            content = `
                <div class="file-attachment">
                    <div class="file-info">
                        <span></span>
                        <div style="flex:1; overflow:hidden;">
                            <div style="font-weight:600; font-size:0.85em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${fileData.name}</div>
                            <a href="${fileData.data}" download="${fileData.name}" class="download-link">⬇ Simpan</a>
                        </div>
                    </div>
                </div>
            `;
        }

        div.innerHTML = content;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function toggleCall() {
        if (isCalling) {
            endCall();
        } else {
            startCall();
            // Auto hang up setelah 1 menit jika tidak dijawab
            callTimeout = setTimeout(() => {
                if (isCalling) {
                    addSystemBubble(' Panggilan tidak dijawab, diakhiri otomatis');
                    endCall();
                }
            }, 60000); // 1 menit
        }
    }

    function startCall() {
        if (!conn || !conn.open) {
            alert('Koneksi terputus. Silakan hubungkan lagi.');
            return;
        }

        navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        })
        .then((stream) => {
            localStream = stream;
            call = peer.call(adminId, stream);

            isCalling = true;
            const btn = document.getElementById('btn-call');
            btn.classList.add('active-call');
            btn.innerHTML = '📴';
            addSystemBubble('📞 Panggilan dimulai...');

            call.on('stream', (remoteStream) => {
                document.getElementById('remoteAudio').srcObject = remoteStream;
                document.getElementById('remoteAudio').play();
            });

            call.on('close', () => resetCallUI());
        })
        .catch(err => {
            console.error('Audio error:', err);
            alert('❌ Gagal akses mikrofon: ' + err.message + '\n\nPastikan:\n1. Izinkan akses mikrofon di browser\n2. Tidak ada aplikasi lain yang menggunakan mikrofon\n3. Restart browser jika perlu');
        });
    }

    function endCall() {
        if (callTimeout) {
            clearTimeout(callTimeout);
            callTimeout = null;
        }
        if (call) call.close();
        if (localStream) localStream.getTracks().forEach(track => track.stop());
        resetCallUI();
    }

    function resetCallUI() {
        isCalling = false;
        const btn = document.getElementById('btn-call');
        btn.classList.remove('active-call');
        btn.innerHTML = '📞';
        addSystemBubble('📴 Panggilan diakhiri.');
    }

    function exitSession(customMessage) {
        if (customMessage) {
            document.getElementById('end-message').innerText = customMessage;
        }

        if (call) {
            endCall();
        }

        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }

        if (conn) {
            conn.send({ type: 'exit', reason: 'patient_left' });
            conn.close();
        }

        if (peer) {
            peer.destroy();
        }

        stopHeartbeat();

        document.getElementById('chat-area').style.display = 'none';
        document.getElementById('patient-info').style.display = 'none';
        document.getElementById('exit-btn').style.display = 'none';
        document.getElementById('ended-screen').style.display = 'flex';
    }

    document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible') {
            console.log('📱 Halaman kembali aktif');
            requestWakeLock();

            if (peer && peer.disconnected) {
                peer.reconnect();
            }

            if (conn && !conn.open && reconnectAttempts < MAX_RECONNECT) {
                addSystemBubble('🔄 Memulihkan koneksi...');
                reconnect();
            }
        }
    });

    requestWakeLock();

    setInterval(() => {
        console.log('🔮 Session check...');
    }, 30000);
</script>
</body>
